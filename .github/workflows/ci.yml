# Runs the tests and type checks on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.13.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: |
          pnpm --filter @skaitch/core build
          pnpm --filter @skaitch/web exec tsc --noEmit
          pnpm --filter @skaitch/desktop typecheck
          pnpm --filter @skaitch/survey typecheck
      - name: Tests
        # Placeholder Firebase settings: the client SDK only checks their shape, nothing is contacted.
        env:
          VITE_FIREBASE_API_KEY: AIzaSy-ci-placeholder-not-a-real-key0000
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: 1:0:web:0
        run: pnpm -r test
